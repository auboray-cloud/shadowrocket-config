# 3. Mainland daily apps: banks, payments, government, short video, and shopping.
RULE-SET,https://raw.githubusercontent.com/auboray-cloud/shadowrocket-config/main/rules/ChinaDaily.list,DIRECT

# 4. Block common ads with a lighter list to reduce mobile overhead and false positives.
RULE-SET,https://raw.githubusercontent.com/auboray-cloud/shadowrocket-config/main/rules/AdvertisingLite.list,REJECT

# 5. Region-sensitive services and dedicated AI routing.
RULE-SET,https://raw.githubusercontent.com/auboray-cloud/shadowrocket-config/main/rules/Telegram.list,PROXY
RULE-SET,https://raw.githubusercontent.com/auboray-cloud/shadowrocket-config/main/rules/AI.list,AI-SG
# Generic OpenAI dependencies remain a normal proxy fallback to avoid capturing shared services and ASNs.
RULE-SET,https://raw.githubusercontent.com/auboray-cloud/shadowrocket-config/main/rules/OpenAI.list,PROXY
RULE-SET,https://raw.githubusercontent.com/auboray-cloud/shadowrocket-config/main/rules/Google.list,PROXY
RULE-SET,https://raw.githubusercontent.com/auboray-cloud/shadowrocket-config/main/rules/AppleNews.list,PROXY
RULE-SET,https://raw.githubusercontent.com/auboray-cloud/shadowrocket-config/main/rules/YouTube.list,PROXY
RULE-SET,https://raw.githubusercontent.com/auboray-cloud/shadowrocket-config/main/rules/Netflix.list,PROXY
RULE-SET,https://raw.githubusercontent.com/auboray-cloud/shadowrocket-config/main/rules/Disney.list,PROXY

# 6. Manual proxy additions for development and privacy checks.
DOMAIN-SUFFIX,github.com,PROXY
DOMAIN-SUFFIX,githubusercontent.com,PROXY
DOMAIN-SUFFIX,githubassets.com,PROXY
DOMAIN-SUFFIX,github.dev,PROXY
DOMAIN-SUFFIX,github.io,PROXY
DOMAIN-SUFFIX,ghcr.io,PROXY
DOMAIN-SUFFIX,gitlab.com,PROXY
DOMAIN-SUFFIX,dnsleaktest.com,PROXY
DOMAIN-SUFFIX,ipleak.net,PROXY
DOMAIN-SUFFIX,browserleaks.com,PROXY
DOMAIN-SUFFIX,browserleaks.org,PROXY

# 7. Apple core services usually work best direct in mainland China.
RULE-SET,https://raw.githubusercontent.com/auboray-cloud/shadowrocket-config/main/rules/Apple.list,DIRECT

# 8. Mainland China traffic is direct only when it matches explicit allowlists.
# Do not use a broad .cn, China IP, or GEOIP fallback here. Unknown traffic
# should fall through to the main Hong Kong proxy route.

# 9. Everything else uses the Hong Kong broker route.
# This keeps config mode close to a Hong Kong global proxy while preserving
# explicit direct rules for daily mainland apps and AI-SG for AI services.
FINAL,BROKER-HK

[MITM]
# Keep empty by default. Only add hostnames here if you fully understand HTTPS MITM.
hostname =
