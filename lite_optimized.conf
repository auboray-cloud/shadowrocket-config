# 6. Mainland China domains and IP ranges direct.
RULE-SET,https://raw.githubusercontent.com/auboray-cloud/shadowrocket-config/main/rules/ChinaMax.list,DIRECT
DOMAIN-SUFFIX,cn,DIRECT
GEOIP,CN,DIRECT

# 7. Everything else uses proxy.
FINAL,PROXY

[MITM]
# Keep empty by default. Only add hostnames here if you fully understand HTTPS MITM.
hostname =
