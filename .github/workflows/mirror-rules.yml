name: Mirror rule sets

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 0"
  push:
    paths:
      - ".github/workflows/mirror-rules.yml"

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download upstream rule sets
        run: |
          set -euo pipefail
          mkdir -p rules
          for name in Telegram; do
            curl -fsSL --retry 3 --retry-delay 2 \
              "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/${name}/${name}.list" \
              -o "rules/${name}.list"
          done

      - name: Write mirror note
        run: |
          cat > MIRROR.md <<'EOF'
          # Mirrored Rule Sets

          Only `Telegram.list` is mirrored from upstream. Other files in `rules/` are curated for `Auboray_SmartLink.conf`.

          Original upstream:

          ```text
          https://github.com/blackmatrix7/ios_rule_script
          ```

          Mirrored upstream files:

          - `Telegram.list`

          Purpose:

          - Keep Shadowrocket usable even if the upstream repository is temporarily unavailable.
          - Make the config depend on `auboray-cloud/shadowrocket-config` instead of directly depending on upstream raw URLs.

          This mirror is refreshed weekly by GitHub Actions. If upstream disappears later, the latest mirrored file remains in this repository.
          EOF

      - name: Commit mirror updates
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MIRROR.md rules/Telegram.list
          if git diff --cached --quiet; then
            echo "No mirror changes to commit."
          else
            git commit -m "Mirror upstream rule sets"
            git push
          fi
